name: time_machine_server
description: "Proxy backend for the history-lens web build: host the provider/geocoder network calls that the browser cannot make (CORS)."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.8.0

dependencies:
  dio: ^5.7.0
  shelf: ^1.4.0
  shelf_router: ^1.1.0
  shelf_static: ^1.1.3
  shelf_web_socket: ^1.0.4
  time_machine_core:
    path: ../time_machine_core
  time_machine_cloud:
    path: ../time_machine_cloud

dev_dependencies:
  http: any
  lints: ^5.0.0
  test: ^1.25.0