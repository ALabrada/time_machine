name: Build and Release Flutter App

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    name: Create Release
    runs-on: self-hosted
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true

  build-android:
    name: Build Android APK
    needs: create-release
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Create secrets file
        run: |
          cat << 'EOF' > lib/secrets.dart
          ${{ secrets.LIB_SECRETS }}
          EOF
      
      - name: Create android key properties
        run: |
          cat << 'EOF' > android/key.properties
          ${{ secrets.ANDROID_KEY }}
          EOF
      
      - run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: build/app/outputs/flutter-apk/app-release.apk
          asset_name: Android.apk
          asset_content_type: application/vnd.android.package-archive

  build-ios:
    name: Build iOS IPA (Unsigned)
    needs: create-release
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Create secrets file
        run: |
          cat << 'EOF' > lib/secrets.dart
          ${{ secrets.LIB_SECRETS }}
          EOF
      
      - run: flutter pub get
      
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
      
      - name: Package as IPA
        run: |
          mkdir -p build/Payload
          cp -R build/ios/iphoneos/Runner.app build/Payload/
          cd build
          zip -r Runner.ipa Payload/
      
      - name: Upload IPA to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: build/Runner.ipa
          asset_name: iOS.ipa
          asset_content_type: application/octet-stream

  build-macos:
    name: Build macOS App (Unsigned)
    needs: create-release
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Create secrets file
        run: |
          cat << 'EOF' > lib/secrets.dart
          ${{ secrets.LIB_SECRETS }}
          EOF

      - run: flutter pub get

      - name: Build macOS (unsigned)
        run: flutter build macos --release

      - name: Package as ZIP
        run: |
          APP="$PWD/build/macos/Build/Products/Release/time_machine.app"
          test -d "$APP"
          cd "$(dirname "$APP")"
          zip -r macOS.zip time_machine.app

      - name: Upload App to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: build/macos/Build/Products/Release/macOS.zip
          asset_name: macOS.zip
          asset_content_type: application/zip

  build-linux:
    name: Build Linux App
    needs: create-release
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Create secrets file
        run: |
          cat << 'EOF' > lib/secrets.dart
          ${{ secrets.LIB_SECRETS }}
          EOF

      - run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package as TAR.GZ
        run: tar -czf Linux.tar.gz -C build/linux/x64/release bundle

      - name: Upload App to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: build/linux/x64/release/Linux.tar.gz
          asset_name: Linux.tar.gz
          asset_content_type: application/gzip

  build-windows:
    name: Build Windows App
    needs: create-release
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Create secrets file
        shell: bash
        run: |
          cat << 'EOF' > lib/secrets.dart
          ${{ secrets.LIB_SECRETS }}
          EOF

      - run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package as ZIP
        run: |
          cd build/windows/x64/runner
          powershell -Command "Compress-Archive -Path Release -DestinationPath Windows.zip -Force"

      - name: Upload App to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: build/windows/x64/runner/Windows.zip
          asset_name: Windows.zip
          asset_content_type: application/zip