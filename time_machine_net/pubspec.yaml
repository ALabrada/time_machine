name: time_machine_net
description: "Flutter networking layer for history-lens: re-exports the pure-Dart cloud/providers (time_machine_cloud) and adds the app-only bits — secure token storage, geocoding, URL/link handling and the CORS proxy client."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  time_machine_core:
    path: ../time_machine_core
  time_machine_cloud:
    path: ../time_machine_cloud

  cross_file: any
  cached_network_image: ^3.4.1
  dio: ^5.7.0
  flutter_cache_manager: any
  flutter_secure_storage: ^9.2.2
  geocoding: ^4.0.0
  intl: any
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  googleapis_auth: ^2.3.3
  http: any
  nextcloud: ^9.0.0
  path: any
  supabase: ^2.6.0